<div class="flex flex-col gap-6">
  @if (error() || !available()) {
    <wl-load-state heading="Defensives" subtitle="How you used your survival cooldowns compared with the top logs." [error]="error()"></wl-load-state>
  } @else {
    <wl-finding-table
      heading="Defensives"
      subtitle="How you used your survival cooldowns compared with the top logs."
      [rows]="findingRows()"
      [onPlan]="onPlan()"
      [showMap]="showMap()"
      [showClip]="showClip()"
      (openMap)="onFindingMap($event)"
      (openClip)="onFindingClip($event)">
    </wl-finding-table>

    @if (windows().length > 0) {
      <wl-window-comparison
        [windows]="windows()"
        [higherIsBetter]="false"
        [showCasts]="false"
        [showMap]="showMap()"
        [showClip]="showClip()"
        heading="Defensive windows"
        subtitle="Damage taken in each defensive window vs top logs."
        metricLabel="Damage taken"
        chipsLabel="Defensives top raiders use here"
        rangeLabel="Damage taken vs top range"
        (openMap)="onOpenMap($event)"
        (openClip)="onOpenClip($event)">
      </wl-window-comparison>
    }
  }
</div>
