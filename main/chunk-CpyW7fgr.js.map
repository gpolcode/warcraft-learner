@if (clip.handle()) {
  @if (clip.playbackFailed()) {
    <div class="text-[13px] text-[var(--muted)]">This clip could not be played.</div>
  } @else {
    <!-- No [src] binding: the component stitches the segment blobs into this element via MSE. -->
    <video
      #player
      class="w-full rounded-[10px] border border-[var(--border)] bg-[var(--bg)]"
      controls
      (loadedmetadata)="onLoaded(player)"
      (timeupdate)="onTick(player)"
      (ended)="onEnded(player)"
      (error)="clip.onPlaybackError()"></video>
    <div class="mt-3 flex items-center justify-end gap-3">
      @if (clip.downloadError()) {
        <span class="text-[12.5px] text-[var(--critical)]">{{ clip.downloadError() }}</span>
      }
      <button mat-stroked-button [disabled]="!clip.clipReady()" (click)="clip.downloadFullPull()">
        <mat-icon>download</mat-icon>
        Download full pull
      </button>
      <button mat-stroked-button (click)="clip.download()">
        <mat-icon>download</mat-icon>
        Download clip
      </button>
    </div>
  }
} @else {
  <div class="text-[13px] text-[var(--muted)]">No footage for this window.</div>
}
