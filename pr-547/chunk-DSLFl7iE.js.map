@if (clip.playbackFailed()) {
  <div class="text-body text-muted-foreground">This clip could not be played.</div>
} @else if (clip.preparing()) {
  <wl-loading-spinner />
} @else if (clip.handle()) {
  <!-- No [src] binding: it would create an object URL nothing revokes. -->
  <video
    #player
    class="w-full rounded-[10px] border bg-background"
    controls
    (loadedmetadata)="onLoaded(player)"
    (timeupdate)="onTick(player)"
    (ended)="onEnded(player)"
    (error)="clip.onPlaybackError()"></video>
  <div class="mt-3 flex items-center justify-end gap-3">
    <button hlmBtn variant="outline" size="sm" [disabled]="!clip.clipReady()" (click)="downloadFullPull()">
      <ng-icon name="download" />
      Download full pull
    </button>
    <button hlmBtn variant="outline" size="sm" (click)="clip.download()">
      <ng-icon name="download" />
      Download clip
    </button>
  </div>
} @else {
  <div class="text-body text-muted-foreground">No footage for this window.</div>
}
