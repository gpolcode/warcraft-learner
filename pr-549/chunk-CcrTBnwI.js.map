@if (clip.playbackFailed()) {
  <div class="text-body text-muted">This clip could not be played.</div>
} @else if (clip.preparing()) {
  <wl-loading-spinner />
} @else if (clip.handle()) {
  <!-- No [src] binding: it would create an object URL nothing revokes. -->
  <video
    #player
    class="w-full rounded-[10px] border border-line bg-bg"
    controls
    (loadedmetadata)="onLoaded(player)"
    (timeupdate)="onTick(player)"
    (ended)="onEnded(player)"
    (error)="clip.onPlaybackError()"></video>
  <div class="mt-3 flex items-center justify-end gap-3">
    <button tuiButton type="button" appearance="outline-grayscale" size="s" iconStart="download" [disabled]="!clip.clipReady()" (click)="downloadFullPull()">Download full pull</button>
    <button tuiButton type="button" appearance="outline-grayscale" size="s" iconStart="download" (click)="clip.download()">Download clip</button>
  </div>
} @else {
  <div class="text-body text-muted">No footage for this window.</div>
}
