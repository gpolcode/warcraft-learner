<tui-elastic-container>
  <div #content [class]="expanded() ? '' : 'line-clamp-2 md:line-clamp-none'"><ng-content /></div>
</tui-elastic-container>

@if (overflowing()) {
  <div class="mt-1.5 text-caption md:hidden">
    <button
      tuiLink
      type="button"
      [iconEnd]="expanded() ? 'expand_less' : 'expand_more'"
      [attr.aria-expanded]="expanded()"
      (click)="toggle()">{{ expanded() ? 'Show less' : 'Show more' }}</button>
  </div>
}
