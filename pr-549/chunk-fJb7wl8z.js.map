<!-- Non-modal on purpose: the page behind stays live, so another moment's "Show map" retargets the open panel instead of having to close it first. -->
<tui-drawer
  *tuiPopup="true"
  class="flyover"
  role="dialog"
  aria-modal="false"
  [attr.aria-labelledby]="headingId"
  [attr.aria-describedby]="introId"
  (keydown.escape)="closed.emit()">
  <header>
    <div tuiHeader="body-l">
      <hgroup tuiTitle>
        <div class="flex items-center gap-2">
          <h2 [id]="headingId">{{ heading() }}</h2>
          @if (loadingText()) {
            <tui-loader size="xs" [textContent]="loadingText()" />
          }
        </div>
        <p tuiSubtitle class="text-muted" [id]="introId">{{ intro() }}</p>
      </hgroup>
      <div tuiAccessories>
        <!-- A body-l header sizes its buttons xs; the explicit s keeps the app-wide size. -->
        <button tuiIconButton type="button" appearance="icon" size="s" iconStart="close" (click)="closed.emit()">{{ closeLabel() }}</button>
      </div>
    </div>
  </header>
  <ng-content />
</tui-drawer>
