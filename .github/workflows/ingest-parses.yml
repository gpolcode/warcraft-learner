name: Ingest Parse Samples

on:
  # Fired hourly by an external scheduler (cron-job.org): GitHub's own cron drops fires and ignores the set minute.
  workflow_dispatch:

# Serializing every gh-pages writer keeps their single-commit force-pushes from reverting each other's folder.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.INGEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.INGEST_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          # Keeps origin/gh-pages when the overlay's fetch fails; without it the publish wipes the gh-pages-only data.
          fetch-depth: 0

      # Bench data lives only on gh-pages; overlay it before ingest so the signature-skip has current data to compare.
      - name: Overlay bench data from gh-pages
        run: |
          set -euo pipefail
          git fetch origin gh-pages || true
          rm -rf frontend/public/data/specs
          # A failed extraction must abort: an empty tree reaching the clean:true publish deletes every spec.
          if git rev-parse --verify --quiet origin/gh-pages >/dev/null \
            && git ls-tree --name-only "origin/gh-pages:data/specs" >/dev/null 2>&1; then
            git archive origin/gh-pages data/specs | tar -x -C frontend/public
            echo "Overlaid existing bench data from gh-pages."
          else
            echo "No existing data on gh-pages; starting from empty (first run)."
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # CURRENT_RAIDS: WCL zone names to bench, comma separated (e.g. "The Venomous Abyss"). Anything else is pruned; unset prunes nothing.
      # PRIORITY_SPECS (repo variable) is optional: unset or malformed falls back safely (see parsePrioritySpecs in ingest-ordering-service.ts).
      # SIMC_TIER (repo variable): the SimulationCraft branch and profile directory the rules derive from, e.g. "midnight/MID2".
      - name: Run parse ingestion
        working-directory: frontend
        env:
          CURRENT_RAIDS: ${{ vars.CURRENT_RAIDS }}
          PRIORITY_SPECS: ${{ vars.PRIORITY_SPECS }}
          SIMC_TIER: ${{ vars.SIMC_TIER }}
          APL_GAPS_FILE: ${{ runner.temp }}/apl-vocabulary-gaps.md
        run: npm run ingest

      # Pruning never removes whole spec dirs, so this trips only on an overlay catastrophe, not a quiet hour.
      - name: Guard against an empty publish tree
        run: |
          set -euo pipefail
          dir=frontend/public/data/specs
          local_specs=$( { find "$dir" -mindepth 1 -maxdepth 1 -type d 2>/dev/null || true; } | wc -l | tr -d ' ')
          remote_specs=$( { git ls-tree -d --name-only "origin/gh-pages:data/specs" 2>/dev/null || true; } | wc -l | tr -d ' ')
          echo "Working tree has $local_specs spec dir(s); gh-pages has $remote_specs."
          if [ "$remote_specs" -gt 0 ] && [ "$local_specs" -eq 0 ]; then
            echo "::error::Refusing to publish: the working tree has no spec data while gh-pages has $remote_specs spec dir(s). A clean:true publish would wipe the published data."
            exit 1
          fi

      # clean:true is scoped to target-folder, so it replaces data/specs/ only and never touches main/ or pr-* previews.
      - name: Publish data to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: gh-pages
          single-commit: true
          folder: frontend/public/data/specs
          target-folder: data/specs
          clean: true

      # One open issue carries the gaps: GitHub mails its creation and each change of the set, and a run that finds the same set leaves it alone.
      - name: Report APL vocabulary gaps as an issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GAPS_FILE: ${{ runner.temp }}/apl-vocabulary-gaps.md
          TITLE: 'APL vocabulary gaps: SimulationCraft tokens outside the inventory'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -s "$GAPS_FILE" ]; then
            echo "No APL vocabulary gaps."
            exit 0
          fi
          fingerprint() { grep -o 'warcraft-learner-gaps:[0-9a-f]*' <<< "$1" || true; }
          body="$(cat "$GAPS_FILE")"
          number="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -z "$number" ]; then
            gh issue create --title "$TITLE" --body "$body"
          elif [ "$(fingerprint "$(gh issue view "$number" --json body --jq .body)")" != "$(fingerprint "$body")" ]; then
            gh issue edit "$number" --body "$body"
            gh issue comment "$number" --body "The set of tokens outside the inventory changed: $RUN_URL"
          else
            echo "Issue #$number already lists these gaps."
          fi
