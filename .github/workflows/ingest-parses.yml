name: Ingest Parse Samples

on:
  schedule:
    # Runs hourly at :23 (off the :00 stampede to reduce GitHub's drop rate).
    # Each run picks the stalest known specs first, bounded by the WCL hourly
    # point budget, so no spec starves when a run is delayed or skipped.
    - cron: '23 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.INGEST_APP_ID }}
          private-key: ${{ secrets.INGEST_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # TEMPORARY (branch-only, do NOT merge to main): repurposed as a print-only
      # validator for the v5 orchestrator. Runs ingest:next for one spec against real
      # WCL and prints the diff vs the committed legacy output - no commit, no scrape.
      # Revert this file to the scrape+ingest+commit pipeline before merging.
      - name: Run v5 orchestrator (ingest:next) for SubtletyRogue
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        working-directory: frontend
        run: npm run ingest:next -- --spec SubtletyRogue

      - name: Diff v5 output vs committed legacy output
        working-directory: frontend
        run: |
          SPEC=SubtletyRogue
          echo "=== git status (changed files) ==="
          git -c core.pager=cat status --short "public/data/specs/$SPEC" || true
          echo
          echo "=== diffstat for $SPEC slices ==="
          git -c core.pager=cat diff --stat "public/data/specs/$SPEC" || true
          echo
          echo "=== per-slice file counts produced ==="
          for s in burst rotation defensive gear positions; do
            echo "$s: $(ls public/data/specs/$SPEC/$s/*.json 2>/dev/null | wc -l) files"
          done
          echo
          echo "=== sample: head of a produced burst file (note source_signature) ==="
          FIRST=$(ls public/data/specs/$SPEC/burst/*.json 2>/dev/null | head -1)
          echo "file: $FIRST"
          head -c 1400 "$FIRST" || true
          echo
          echo "=== full diff (first 500 lines) ==="
          git -c core.pager=cat diff "public/data/specs/$SPEC" | head -500 || true
