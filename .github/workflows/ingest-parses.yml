name: Ingest Parse Samples

on:
  # Fired hourly by an external scheduler (cron-job.org): GitHub's own cron drops fires and ignores the set minute.
  workflow_dispatch:

# Serializing every gh-pages writer keeps their single-commit force-pushes from reverting each other's folder.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.INGEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.INGEST_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Write the WCL client file
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          [ -n "$WCL_CLIENT_ID" ] && [ -n "$WCL_CLIENT_SECRET" ] || { echo "::error::Set the WCL_CLIENT_ID and WCL_CLIENT_SECRET repository secrets."; exit 1; }
          printf "export const WCL_CLIENT_ID = '%s';\nexport const WCL_CLIENT_SECRET = '%s';\n" "$WCL_CLIENT_ID" "$WCL_CLIENT_SECRET" > src/environments/wcl-client.ts
        working-directory: frontend

      # Every later step carries this gate; one added without it would run on skipped hours too.
      - name: Check the WCL budget
        id: budget
        working-directory: frontend
        run: node scripts/wcl-budget.mjs ingest

      # Bench data lives only on gh-pages; overlay it before ingest so the signature-skip has current data to compare.
      - name: Overlay bench data from gh-pages
        if: steps.budget.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          # Exit 2 means gh-pages does not exist yet; any other failure aborts, since an empty tree reaching the clean:true publish deletes every spec.
          status=0
          git ls-remote --exit-code --heads origin gh-pages >/dev/null || status=$?
          case "$status" in
            0)
              git fetch --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
              # The deploy action re-adds origin, which drops origin/gh-pages; this ref lets its own fetch find the tree already here.
              git update-ref refs/ingest/gh-pages refs/remotes/origin/gh-pages
              ;;
            2) ;;
            *) exit "$status" ;;
          esac
          rm -rf frontend/public/data/specs
          # A failed extraction must abort: an empty tree reaching the clean:true publish deletes every spec.
          if git rev-parse --verify --quiet origin/gh-pages >/dev/null \
            && git ls-tree --name-only "origin/gh-pages:data/specs" >/dev/null 2>&1; then
            git archive origin/gh-pages data/specs | tar -x -C frontend/public
            echo "Overlaid existing bench data from gh-pages."
          else
            echo "No existing data on gh-pages; starting from empty (first run)."
          fi

      - name: Install dependencies
        if: steps.budget.outputs.proceed == 'true'
        working-directory: frontend
        run: npm ci

      # Entries are immutable, so each run saves under its own key and the next restores the newest; LRU eviction drops the older ones.
      - name: Restore stored WCL responses
        if: steps.budget.outputs.proceed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.wcl-cache
          key: wcl-responses-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wcl-responses-

      - name: Run parse ingestion
        if: steps.budget.outputs.proceed == 'true'
        working-directory: frontend
        run: npm run ingest

      # The file server refreshes an entry's time on every read, so this drops what no run has read in 21 days.
      - name: Prune stored WCL responses
        if: ${{ !cancelled() && steps.budget.outputs.proceed == 'true' }}
        run: |
          if [ -d frontend/.wcl-cache ]; then find frontend/.wcl-cache -type f -mtime +21 -delete; fi

      # Saved even when ingestion failed: every stored response is a complete WCL answer, whatever happened after it.
      - name: Save stored WCL responses
        if: ${{ !cancelled() && steps.budget.outputs.proceed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.wcl-cache
          key: wcl-responses-${{ github.run_id }}-${{ github.run_attempt }}

      # Pruning never removes whole spec dirs, so this trips only on an overlay catastrophe, not a quiet hour.
      - name: Guard against an empty publish tree
        if: steps.budget.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          dir=frontend/public/data/specs
          local_specs=$( { find "$dir" -mindepth 1 -maxdepth 1 -type d 2>/dev/null || true; } | wc -l | tr -d ' ')
          remote_specs=$( { git ls-tree -d --name-only "origin/gh-pages:data/specs" 2>/dev/null || true; } | wc -l | tr -d ' ')
          echo "Working tree has $local_specs spec dir(s); gh-pages has $remote_specs."
          if [ "$remote_specs" -gt 0 ] && [ "$local_specs" -eq 0 ]; then
            echo "::error::Refusing to publish: the working tree has no spec data while gh-pages has $remote_specs spec dir(s). A clean:true publish would wipe the published data."
            exit 1
          fi

      # clean:true is scoped to target-folder, so it replaces data/specs/ only and never touches main/ or pr-* previews.
      - name: Publish data to gh-pages
        if: steps.budget.outputs.proceed == 'true'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: gh-pages
          single-commit: true
          folder: frontend/public/data/specs
          target-folder: data/specs
          clean: true
