name: Calibration Test Data

on:
  push:
    branches: [claude/verdict-validity-p6c-downtime]
    paths: ['.github/calibration-data.marker']

# The gh-pages group serializes this run with the hourly ingest, which spends the same WCL budget.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  calibration-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Holy Paladin keeps its stored benches, so the run stays inside its point budget.
      SUBSET: "{ specs: ['AssassinationRogue', 'BalanceDruid', 'ProtectionPaladin'], encounterIds: [3470, 3445, 3455] }"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Write the WCL client file
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          [ -n "$WCL_CLIENT_ID" ] && [ -n "$WCL_CLIENT_SECRET" ] || { echo "::error::Set the WCL_CLIENT_ID and WCL_CLIENT_SECRET repository secrets."; exit 1; }
          printf "export const WCL_CLIENT_ID = '%s';\nexport const WCL_CLIENT_SECRET = '%s';\n" "$WCL_CLIENT_ID" "$WCL_CLIENT_SECRET" > src/environments/wcl-client.ts
        working-directory: frontend

      # A low budget fails the run before any spend, so a skipped hour never reads as a measured report.
      - name: Check the WCL budget
        id: budget
        working-directory: frontend
        run: |
          set -euo pipefail
          node scripts/wcl-budget.mjs ingest
          grep -q '^proceed=true$' "$GITHUB_OUTPUT" || { echo "::error::The WCL budget cannot cover the ingest margin; push the marker again after the reset."; exit 1; }

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Restore stored WCL responses
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: frontend/.wcl-cache
          key: wcl-responses-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wcl-responses-

      - name: Name the ingest subset
        working-directory: frontend
        run: |
          set -euo pipefail
          file=src/environments/environment.ingest.ts
          sed -i "s|^export const environment = baseEnvironment;$|export const environment = { ...baseEnvironment, ingestSubset: $SUBSET };|" "$file"
          grep -q 'ingestSubset' "$file" || { echo "::error::The subset did not land in $file."; exit 1; }

      - name: Seed the stored test data
        working-directory: frontend
        run: DATA_REF=calibration-testdata npm run data:pull

      # The orchestrator stops before an encounter once the budget is under INGEST_POINTS_MARGIN, far above E2E_POINTS_NEEDED.
      - name: Run the subset ingest
        working-directory: frontend
        run: npm run ingest

      # A breach is a finding of the report, not a reason to lose the data.
      - name: Recompute calibration
        id: calibrate
        continue-on-error: true
        working-directory: frontend
        run: npm run calibrate

      - name: Confirm the E2E budget is left
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: node scripts/wcl-budget.mjs e2e

      - name: Keep the data as an artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calibration-testdata
          path: frontend/public/data/specs

      - name: Publish to calibration-testdata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/calibration-testdata"
          mkdir -p "$out/data"
          cp -r frontend/public/data/specs "$out/data/specs"
          cd "$out"
          git init -q -b calibration-testdata
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Calibration test data from run ${GITHUB_RUN_ID} at ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" calibration-testdata
