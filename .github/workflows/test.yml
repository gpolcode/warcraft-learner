name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # node-version '22' resolves to the latest 22.x, which satisfies the
      # @angular/build:unit-test (Vitest) builder's >= 22.22.3 floor.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Run unit tests
        run: npm run test:ci
        working-directory: frontend

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # Coverage is reported, never gated: the summary is written to the run's job
      # summary so gaps (an untested unit, a by-design-untested component) are visible
      # on every PR without a threshold that would block merges.
      - name: Run coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Publish coverage summary
        if: always()
        working-directory: frontend
        run: |
          node -e '
            const fs = require("fs");
            const rows = [["Suite", "Statements", "Branches", "Functions", "Lines"]];
            for (const [name, path] of [["frontend", "coverage/frontend/coverage-summary.json"], ["scripts", "coverage/scripts/coverage-summary.json"]]) {
              if (!fs.existsSync(path)) continue;
              const t = JSON.parse(fs.readFileSync(path, "utf8")).total;
              rows.push([name, t.statements.pct + "%", t.branches.pct + "%", t.functions.pct + "%", t.lines.pct + "%"]);
            }
            const md = ["## Coverage", "", "| " + rows[0].join(" | ") + " |", "| " + rows[0].map(() => "---").join(" | ") + " |", ...rows.slice(1).map(r => "| " + r.join(" | ") + " |"), ""].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          '
