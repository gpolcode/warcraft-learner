name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:

# The gh-pages push authenticates with the app token minted per job, so the default token
# never needs repo write.
permissions:
  contents: read

# Shared with ingest-parses (the data/ tree): every gh-pages writer force-pushes a single
# squashed commit built from a start-of-job checkout, so concurrent writers would revert
# each other's folders. cancel-in-progress: false serializes them instead.
concurrency:
  group: gh-pages
  cancel-in-progress: false

env:
  TARGET_FOLDER: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}

jobs:
  # Runs untrusted PR head code (npm ci lifecycle scripts + the PR's own build config), so it
  # holds NO write credential: no app token, and persist-credentials:false keeps even the
  # read-only GITHUB_TOKEN out of .git/config. The static output reaches publish as an artifact.
  build:
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || 'main' }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Ships the shell only: the site reads the one shared data/specs/ copy at the gh-pages
      # root via the absolute dataBaseHref.
      - name: Build the site
        run: |
          set -euo pipefail
          npm --prefix frontend ci
          npm --prefix frontend run build -- --base-href "/$TARGET_FOLDER/"

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: static/angular/browser
          include-hidden-files: true
          retention-days: 1

  # Runs NO PR-authored code - only the deploy action over the already-built artifacts - so it
  # is the only job that holds the write-scoped app token.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.INGEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.INGEST_APP_PRIVATE_KEY }}

      # The deploy action builds its worktree from this checkout and pushes with the persisted
      # app token. Safe here because this job never checks out PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Download site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site

      - name: Stage the root redirect
        if: env.TARGET_FOLDER == 'main'
        run: |
          set -euo pipefail
          rm -rf pages-root
          mkdir -p pages-root
          cp .github/pages-root/index.html pages-root/index.html
          # Pages serves 404.html site-wide, booting the SPA for deep links under /main/.
          cp site/index.html pages-root/404.html

      - name: Publish the shell to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: gh-pages
          single-commit: true
          folder: site
          target-folder: ${{ env.TARGET_FOLDER }}
          clean: false

      # This one deploys to the gh-pages root, where clean:true would delete every entry the
      # folder does not carry: data/specs/, main/, and every preview.
      - name: Publish the root redirect to gh-pages
        if: env.TARGET_FOLDER == 'main'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: gh-pages
          single-commit: true
          folder: pages-root
          clean: false

  # The cron is the backstop: a pull_request:closed run can lose the gh-pages concurrency
  # queue and be cancelled before it reaps its own preview.
  # needs: publish keeps a manual run from having two jobs push gh-pages at once.
  cleanup-previews:
    needs: publish
    if: >-
      !cancelled()
      && (github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.action == 'closed'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.INGEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.INGEST_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Drop previews whose pull request is no longer open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stale=()
          for dir in pr-*/; do
            [ -d "$dir" ] || continue
            number=${dir#pr-}
            number=${number%/}
            state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq .state 2>/dev/null || echo unreadable)
            case "$state" in
              open) echo "PR #$number is open; keeping $dir" ;;
              closed) stale+=("${dir%/}") ;;
              # A rate-limited or 404 lookup must not retire a preview that is still live.
              *) echo "::warning::Could not read the state of PR #$number; keeping $dir" ;;
            esac
          done
          if [ ${#stale[@]} -eq 0 ]; then
            echo "No previews to retire."
            exit 0
          fi
          git rm -r --quiet "${stale[@]}"
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Retire previews: ${stale[*]}"
          git push origin HEAD:gh-pages
