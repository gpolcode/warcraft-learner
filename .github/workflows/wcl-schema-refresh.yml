name: Refresh WCL Schema

# Codegen and CI's in-sync check read only the committed SDL, so upstream WCL drift stays invisible without this re-introspection.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wcl-schema-refresh
  cancel-in-progress: false

env:
  REFRESH_BRANCH: chore/wcl-schema-refresh
  SDL: frontend/schema/wcl.graphql
  GENERATED: frontend/src/app/core/services/wcl-operations.generated.ts

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.INGEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.INGEST_APP_PRIVATE_KEY }}

      # A PR authored with GITHUB_TOKEN never triggers test.yml or e2e.yml; the app token's PR does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # schema:pull authenticates with the embedded public WCL client pair in the repo, so this needs no secret.
      - name: Re-introspect WCL and regenerate the operation types
        working-directory: frontend
        run: |
          npm run schema:pull
          npm run codegen

      - name: Detect schema drift
        id: drift
        run: |
          set -euo pipefail
          if git diff --quiet -- "$SDL" "$GENERATED"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'The committed schema and generated types still match live WCL.'
            exit 0
          fi
          git --no-pager diff --stat -- "$SDL" "$GENERATED"
          git fetch --no-tags origin "+refs/heads/$REFRESH_BRANCH:refs/remotes/origin/$REFRESH_BRANCH" || true
          # An unmerged refresh branch already carries this drift, so re-pushing it would only re-notify its reviewers.
          if git rev-parse --verify --quiet "refs/remotes/origin/$REFRESH_BRANCH" >/dev/null \
            && git diff --quiet "origin/$REFRESH_BRANCH" -- "$SDL" "$GENERATED"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "$REFRESH_BRANCH already carries this refresh; leaving it alone."
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Open or update the refresh pull request
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git switch -c "$REFRESH_BRANCH"
          git -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m 'Refresh the WCL schema and generated operation types' -- "$SDL" "$GENERATED"
          git push --force origin "$REFRESH_BRANCH"
          body=$(printf '%s\n\n%s\n' \
            'npm run schema:pull re-introspected live WCL and npm run codegen regenerated the operation types from it.' \
            'Read the SDL diff for a field the app selects that WCL renamed, removed or made nullable, and for a JSON field that needs its own scalar in frontend/scripts/wcl-json-scalars.mjs.')
          if [ -n "$(gh pr list --head "$REFRESH_BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Updated the open pull request for $REFRESH_BRANCH."
          elif ! gh pr create --base main --head "$REFRESH_BRANCH" \
              --title 'Refresh the WCL schema and generated operation types' --body "$body"; then
            echo "::error::WCL's schema changed and $REFRESH_BRANCH carries the refresh, but this job cannot open its pull request. Grant the app pull-requests: write, or open the PR from that branch by hand."
            exit 1
          fi
