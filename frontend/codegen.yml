# Adding the `typescript` plugin alongside re-declares every enum `typescript-operations` already emits.
schema: schema/wcl.graphql
documents: src/app/core/services/wcl-queries.ts
pluckConfig:
  globalGqlIdentifierName: gql
generates:
  src/app/core/services/wcl-operations.generated.ts:
    plugins:
      - typescript-operations
    config:
      skipTypename: true
      enumsAsTypes: true
      scalars:
        # Selecting a field still typed as WCL's shared JSON scalar is a compile error at the read site: split it out first.
        JSON: never
        PlayerDetailsJson: ../models/wcl.models#PlayerDetailsBlob
        TableJson: ../models/wcl.models#WclTableBlob
        RankingsJson: ../models/wcl.models#WclRankingsBlob
        EventDataJson: ../models/wcl.models#WclEventData
      strictScalars: true
