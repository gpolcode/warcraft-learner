<div class="bg-[var(--surface)] border border-[var(--border)] rounded-[10px] p-4">
  <div class="flex items-start gap-2.5">
    @switch (error().kind) {
      @case ('transient') {
        <mat-icon class="icon-18 badge-warning mt-px shrink-0">cloud_off</mat-icon>
        <div>
          <div class="text-sm font-semibold text-[var(--text)]">{{ error().message }}</div>
          <div class="text-[12.5px] text-[var(--muted)] leading-relaxed mt-0.5">
            Retries on the next sync, or reselect the fight.
          </div>
        </div>
      }
      @case ('permanent') {
        <mat-icon class="icon-18 badge-critical mt-px shrink-0">error</mat-icon>
        <div>
          <div class="text-sm font-semibold text-[var(--text)]">{{ error().message }}</div>
          <div class="text-[12.5px] text-[var(--muted)] leading-relaxed mt-0.5">
            This analysis is bugged. Retrying will not fix it.
          </div>
        </div>
      }
    }
  </div>
</div>
