<!-- Toolbar background comes from mat.toolbar-overrides in styles.scss (a plain
     bg-* utility loses to Material's unlayered background rule). -->
<mat-toolbar class="border-b border-[var(--border)] gap-2">
  <button mat-icon-button (click)="toggleNav()" aria-label="Toggle navigation menu">
    <mat-icon>menu</mat-icon>
  </button>

  <a routerLink="/" class="flex items-center gap-2 no-underline text-[var(--gold)] font-bold text-[15px]" aria-label="warcraft-learner home">
    <svg class="w-6 h-6 shrink-0" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <path class="fill-[var(--gold)]" d="M16 4 L27 7 L27 15.5 C27 21.5 22.5 26.5 16 29 C9.5 26.5 5 21.5 5 15.5 L5 7 Z"/>
      <g class="fill-[var(--surface)]">
        <rect x="9.5" y="18" width="3" height="4" rx="1"/>
        <rect x="14.5" y="14" width="3" height="8" rx="1"/>
        <rect x="19.5" y="10" width="3" height="12" rx="1"/>
      </g>
    </svg>
    <span>warcraft-learner</span>
  </a>

  <span class="flex-1"></span>

  <!-- Single overflow action, so it is a direct link rather than a dropdown menu
       (dropping mat-menu keeps the CDK overlay out of the eager bundle). -->
  <a mat-icon-button [href]="githubUrl" target="_blank" rel="noopener noreferrer" aria-label="View on GitHub">
    <mat-icon svgIcon="github"></mat-icon>
  </a>
</mat-toolbar>

<!-- Drawer + content. The drawer is a plain flex child on desktop (persistent, pushes
     the content) and an absolutely-positioned overlay on mobile (over the content, with a
     scrim), replacing mat-sidenav/mat-nav-list so the CDK overlay and @angular/forms leave
     the eager bundle. Positioning is absolute within this relative body, so the overlay
     never has to know the toolbar height. -->
<div class="relative flex flex-1 min-h-0">
  @if (isMobile() && mobileOpen()) {
    <button
      type="button"
      class="absolute inset-0 z-40 border-0 bg-[var(--bg)]/70 cursor-default"
      aria-label="Close navigation"
      (click)="closeMobile()"></button>
  }

  @if (drawerVisible()) {
    <nav
      class="w-[240px] shrink-0 overflow-y-auto border-r border-[var(--border)] bg-[var(--surface)] py-2"
      [class.absolute]="isMobile()"
      [class.inset-y-0]="isMobile()"
      [class.left-0]="isMobile()"
      [class.z-50]="isMobile()">
      <a
        routerLink="/pre"
        routerLinkActive="nav-active"
        class="flex items-center gap-3 px-4 py-3 no-underline text-[var(--text)] hover:bg-[var(--surface-alt)] transition-colors"
        (click)="onNavigate()">
        <mat-icon>lightbulb</mat-icon>
        <span>Pre-Fight</span>
      </a>
      <a
        routerLink="/"
        routerLinkActive="nav-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 px-4 py-3 no-underline text-[var(--text)] hover:bg-[var(--surface-alt)] transition-colors"
        (click)="onNavigate()">
        <mat-icon>analytics</mat-icon>
        <span>Analyze</span>
      </a>
    </nav>
  }

  <main class="flex-1 min-w-0 overflow-y-auto">
    <ng-content></ng-content>
  </main>
</div>
