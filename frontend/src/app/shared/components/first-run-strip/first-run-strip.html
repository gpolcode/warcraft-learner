<div class="bg-[var(--surface)] border border-[var(--border)] rounded-[10px] p-4">
  <div class="flex items-start gap-2.5">
    <mat-icon class="icon-18 text-[var(--info)] mt-px shrink-0">info</mat-icon>
    <div>
      <div class="text-sm font-semibold text-[var(--text)]">{{ copy().headline }}</div>
      <div class="text-[12.5px] text-[var(--muted)] leading-relaxed mt-0.5">{{ copy().intro }}</div>
    </div>
  </div>

  <div class="flex items-stretch gap-1 bg-[var(--bg)] border border-[var(--border)] rounded-lg px-4 py-3.5 mt-3.5">
    @for (step of copy().steps; track step.label) {
      @if (!$first) {
        <div class="w-[26px] shrink-0 flex items-center justify-center">
          <mat-icon class="icon-16 text-[var(--border)]">arrow_forward</mat-icon>
        </div>
      }
      <div class="flex-1 flex flex-col gap-1.5">
        <mat-icon class="icon-seg text-[var(--muted)]">{{ step.icon }}</mat-icon>
        <div class="text-xs font-semibold text-[var(--text)]">{{ step.label }}</div>
        <div class="text-[11px] text-[var(--muted)] leading-snug">{{ step.detail }}</div>
      </div>
    }
  </div>
</div>
