<hlm-drawer state="open" [direction]="phone() ? 'bottom' : 'right'" (closed)="closed.emit()">
  <hlm-drawer-content *hlmDrawerPortal="let ctx"
    class="data-[vaul-drawer-direction=right]:w-[460px] data-[vaul-drawer-direction=right]:sm:max-w-none">
    <hlm-drawer-header class="relative border-b pe-12">
      <h2 hlmDrawerTitle>{{ heading() }}</h2>
      <p hlmDrawerDescription>{{ intro() }}</p>
      <button hlmBtn hlmDrawerClose variant="ghost" size="icon-sm" class="absolute end-2 top-2" [attr.aria-label]="closeLabel()">
        <ng-icon name="close" />
      </button>
    </hlm-drawer-header>
    <!-- Only the header drags the drawer, so the map scrubber and the video seek bar keep their own pointer gestures. -->
    <div class="min-h-0 flex-1 overflow-y-auto p-4" (pointerdown)="$event.stopPropagation()">
      @if (loadingText()) {
        <div hlmMarker role="status" class="mb-3">
          <span hlmMarkerIcon><hlm-spinner /></span>
          <span hlmMarkerContent class="shimmer">{{ loadingText() }}</span>
        </div>
      }
      <ng-content />
    </div>
  </hlm-drawer-content>
</hlm-drawer>
