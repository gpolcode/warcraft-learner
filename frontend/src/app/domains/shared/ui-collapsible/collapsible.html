<!-- 48px = two 20px badge rows + the 8px gap; any higher leaves a sliced third row peeking out. -->
<div #content [class]="expanded() ? '' : (mode() === 'chips' ? 'max-h-[48px] overflow-hidden' : 'line-clamp-2 md:line-clamp-none')"><ng-content /></div>

@if (overflowing()) {
  <button hlmBtn variant="link" size="xs" class="mt-1 h-auto px-0" [class.md:hidden]="mode() !== 'chips'"
    [attr.aria-expanded]="expanded()" (click)="toggle()">
    {{ expanded() ? 'Show less' : 'Show more' }}
    <ng-icon [name]="expanded() ? 'expand_less' : 'expand_more'" />
  </button>
}
