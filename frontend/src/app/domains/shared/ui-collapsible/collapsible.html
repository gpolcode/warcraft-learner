<!-- 60px = two 24px chip rows + the 8px gap; any higher leaves a sliced third row peeking out. -->
<div #content [class]="expanded() ? '' : (mode() === 'chips' ? 'max-h-[60px] overflow-hidden' : 'line-clamp-2 md:line-clamp-none')"><ng-content /></div>

@if (overflowing()) {
  <div class="mt-1.5 text-caption" [class.md:hidden]="mode() !== 'chips'">
    <button
      tuiLink
      type="button"
      [iconEnd]="expanded() ? 'expand_less' : 'expand_more'"
      [attr.aria-expanded]="expanded()"
      (click)="toggle()">{{ expanded() ? 'Show less' : 'Show more' }}</button>
  </div>
}
