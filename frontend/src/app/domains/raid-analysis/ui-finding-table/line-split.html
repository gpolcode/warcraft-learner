<div class="text-label text-muted mb-1.5">When you pressed it</div>
<div class="flex flex-col gap-2">
  @for (line of lines(); track $index) {
    <div class="grid grid-cols-[1fr_auto] gap-x-(--gap-card) gap-y-0.5 items-baseline">
      <div class="min-w-0 text-body">{{ line.text }}</div>
      <div class="tabular-nums text-caption text-muted text-right whitespace-nowrap">
        You {{ line.you === null ? '-' : (line.you | percent) }} / top logs {{ line.top === null ? '-' : (line.top | percent) }}
      </div>
    </div>
  }
</div>
