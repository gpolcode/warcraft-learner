<div class="flex flex-col gap-6">
  @if (error() || !available()) {
    <wl-load-state heading="Offensives" subtitle="How you used your damage cooldowns compared with the top logs." [error]="error()"></wl-load-state>
  } @else {
    @if (ruleRows().length || ruleOnPlanChips().length) {
      <wl-finding-table
        heading="Rotation rules"
        subtitle="Your casts against the lines of SimulationCraft's priority list for your spec, next to how often the top Mythic logs stray from them."
        [rows]="ruleRows()"
        [onPlan]="ruleOnPlanChips()">
      </wl-finding-table>
    }

    <wl-finding-table
      heading="Offensives"
      subtitle="How you used your damage cooldowns compared with the top logs."
      [rows]="offensiveRows()"
      [onPlan]="onPlan()">
    </wl-finding-table>
  }
</div>
