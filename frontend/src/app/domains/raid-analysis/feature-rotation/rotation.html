<div class="flex flex-col gap-6">
  @if (error() || !available()) {
    <wl-load-state heading="Offensives" subtitle="How you used your damage cooldowns compared with the top logs." [error]="error()"></wl-load-state>
  } @else {
    @if (ruleRows().length || ruleOnPlanChips().length) {
      <wl-finding-table
        heading="Rotation rules"
        subtitle="Buttons you pressed at the wrong time, or skipped when they were due, more often than the top Mythic logs for your spec."
        [rows]="ruleRows()"
        [onPlan]="ruleOnPlanChips()">
      </wl-finding-table>
    }

    <wl-finding-table
      heading="Offensives"
      subtitle="How you used your damage cooldowns compared with the top logs."
      [rows]="offensiveRows()"
      [onPlan]="onPlan()">
    </wl-finding-table>
  }
</div>
