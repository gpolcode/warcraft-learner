<div class="flex flex-col gap-6">
  @if (error() || !available()) {
    <!-- Offensive cooldowns are bench-driven; the load-state stands in until a bench exists, or shows the error. -->
    <wl-load-state heading="Offensives" subtitle="How you used your damage cooldowns compared with the top logs." [error]="error()"></wl-load-state>
  } @else {
    @if (ruleRows().length || ruleOnPlanChips().length) {
      <wl-finding-table
        heading="Rotation rules"
        subtitle="How your casts held up against the rules the top Mythic logs follow for your spec."
        [rows]="ruleRows()"
        [onPlan]="ruleOnPlanChips()">
      </wl-finding-table>
    }

    <wl-finding-table
      heading="Offensives"
      subtitle="How you used your damage cooldowns compared with the top logs."
      [rows]="offensiveRows()"
      [onPlan]="onPlan()">
    </wl-finding-table>
  }
</div>
