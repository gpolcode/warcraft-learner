<section tuiCardLarge appearance="outline-grayscale" class="card-flush">

  <header tuiHeader="body-l" class="px-4 pt-3 pb-2">
    <hgroup tuiTitle>
      <h2>{{ heading() }}</h2>
      @if (subtitle()) {
        <p tuiSubtitle>{{ subtitle() }}</p>
      }
    </hgroup>
  </header>

  <wl-range-legend class="px-4 pb-2.5"></wl-range-legend>

  @for (row of rows(); track $index) {
    @let open = openIndex() === $index;
    <div class="border-t border-line">
      <div class="flex items-center gap-(--gap-card) pl-4 pr-2 py-1">
        <div class="flex min-w-0 flex-1 items-center overflow-hidden">
          <wl-game-icon [id]="row.spellId" [icon]="row.icon" [name]="row.name"></wl-game-icon>
        </div>
        <wl-range-bar class="h-4 w-28 sm:w-45 shrink-0"
          [you]="row.you * 100" [rangeLeft]="row.top.lo * 100" [rangeWidth]="(row.top.hi - row.top.lo) * 100" [avg]="row.top.avg * 100"
          [status]="row.status">
        </wl-range-bar>
        <span class="sr-only">
          You {{ row.you | percent }}.
          Top raiders {{ row.top.lo | percent }} to {{ row.top.hi | percent }}, {{ row.top.avg | percent }} on average.
        </span>
        <button tuiIconButton type="button" appearance="flat-grayscale"
          [tuiChevron]="open"
          [attr.aria-expanded]="open"
          (click)="toggle($index)">{{ open ? 'Hide instances' : 'Show instances' }}</button>
      </div>

      <tui-expand [expanded]="open">
        <div *tuiItem class="px-4 pt-1 pb-4">
          <wl-finding-occurrences
            [occurrences]="row.occurrences"
            [showMap]="showMap()"
            [showClip]="showClip()"
            (openMap)="openMap.emit($event)"
            (openClip)="openClip.emit($event)">
          </wl-finding-occurrences>
        </div>
      </tui-expand>
    </div>
  }

</section>
