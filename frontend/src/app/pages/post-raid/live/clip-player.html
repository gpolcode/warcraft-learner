<div class="flex items-center gap-2 flex-wrap mb-3">
  <span class="text-sm font-medium">{{ clip.contextLabel() }}</span>
  @for (spell of clip.contextSpells(); track spell.id) {
    <wl-game-icon [id]="spell.id" [icon]="spell.icon" [name]="spell.name"></wl-game-icon>
  }
</div>

@if (clip.handle(); as handle) {
  <video
    #player
    class="w-full rounded-[10px] border border-[var(--border)] bg-[var(--bg)]"
    controls
    [src]="handle.url"
    (loadedmetadata)="onLoaded(player)"></video>
  <div class="mt-3 flex items-center justify-end">
    <button mat-stroked-button (click)="clip.download()">
      <mat-icon>download</mat-icon>
      Download
    </button>
  </div>
} @else if (!clip.extracting()) {
  <div class="text-[13px] text-[var(--muted)]">No footage for this window.</div>
}
