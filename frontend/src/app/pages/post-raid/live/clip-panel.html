@if (clip.open()) {
  @if (isMobile()) {
    <div class="fixed inset-0 z-50 flex flex-col bg-[var(--bg)]">
      <div class="flex items-center justify-between border-b border-[var(--border)] px-4 py-2">
        <div class="flex items-center gap-2">
          <span class="font-semibold">Replay</span>
          @if (clip.extracting()) {
            <span class="text-[13px] text-[var(--muted)]">Cutting the clip...</span>
          }
        </div>
        <button mat-icon-button aria-label="Close replay" (click)="clip.close()"><mat-icon>close</mat-icon></button>
      </div>
      <div class="flex-1 overflow-y-auto p-4">
        <wl-clip-player />
      </div>
    </div>
  } @else {
    <div class="fixed right-0 top-0 z-50 flex h-full w-[460px] flex-col border-l border-[var(--border)] bg-[var(--bg)] shadow-2xl">
      <div class="flex items-center justify-between border-b border-[var(--border)] px-4 py-2">
        <div class="flex items-center gap-2">
          <span class="font-semibold">Replay</span>
          @if (clip.extracting()) {
            <span class="text-[13px] text-[var(--muted)]">Cutting the clip...</span>
          }
        </div>
        <button mat-icon-button aria-label="Close replay" (click)="clip.close()"><mat-icon>close</mat-icon></button>
      </div>
      <div class="flex-1 overflow-y-auto p-4">
        <wl-clip-player />
      </div>
    </div>
  }
}
