<div class="flex flex-col gap-6">
  <!-- Rotation rules: rendered only when there is something to say. -->
  @if (ruleRows().length || ruleOnPlanChips().length) {
    <wl-finding-table
      heading="Rotation Rules"
      subtitle="Rotation rules vs top parses."
      [rows]="ruleRows()"
      [onPlan]="ruleOnPlanChips()">
    </wl-finding-table>
  }

  <!-- Offensive cooldowns: bench-driven. When there is no top-parse bench yet the
       comparison has nothing to grade against, so show the waiting state instead. -->
  @if (available()) {
    <wl-finding-table
      heading="Offensives"
      subtitle="Offensive cooldowns vs top parses."
      [rows]="offensiveRows()"
      [onPlan]="onPlan()">
    </wl-finding-table>
  } @else {
    <wl-waiting-placeholder
      heading="Offensives"
      subtitle="Offensive cooldowns vs top parses."
      caption="Your cooldown timing has nothing to be compared against yet.">
    </wl-waiting-placeholder>
  }
</div>
