@if (map.open()) {
  <!-- Mobile: full-screen sheet (inset-0). Desktop (md): right 460px drawer with a left
       border + shadow. One markup, responsiveness via Tailwind utilities only. -->
  <div class="fixed inset-0 z-50 flex flex-col bg-[var(--bg)] md:inset-y-0 md:left-auto md:right-0 md:w-[460px] md:border-l md:border-[var(--border)] md:shadow-2xl">
    <div class="flex items-center justify-between border-b border-[var(--border)] px-4 py-2">
      <div class="flex items-center gap-2">
        <span class="font-semibold">Positioning</span>
        @if (map.overlayLoading()) {
          <span class="text-[13px] text-[var(--muted)]">Loading your trail...</span>
        }
      </div>
      <button mat-icon-button aria-label="Close map" (click)="map.close()"><mat-icon>close</mat-icon></button>
    </div>
    <div class="flex-1 overflow-y-auto p-4">
      <wl-map-canvas />
    </div>
  </div>
}
