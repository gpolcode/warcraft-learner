@if (error() || !available()) {
  <wl-load-state heading="Burst Windows" subtitle="Damage in each burst window vs top logs." [error]="error()"></wl-load-state>
} @else {
  <wl-window-comparison
    [windows]="windows()"
    [higherIsBetter]="true"
    [showMap]="showMap()"
    [showClip]="showClip()"
    heading="Burst Windows"
    subtitle="Damage in each burst window vs top logs."
    metricLabel="burst"
    chipsLabel="Recommended cooldowns"
    rangeLabel="Damage vs top range"
    (openMap)="onOpenMap($event)"
    (openClip)="onOpenClip($event)">
  </wl-window-comparison>
}
