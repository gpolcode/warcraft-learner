@if (error() || !available()) {
  <wl-load-state heading="Burst Windows" subtitle="The short stretches where you deal your biggest damage, compared with the top logs." [error]="error()"></wl-load-state>
} @else {
  <wl-window-comparison
    [windows]="windows()"
    [higherIsBetter]="true"
    [showMap]="showMap()"
    [showClip]="showClip()"
    heading="Burst Windows"
    subtitle="The short stretches where you deal your biggest damage, compared with the top logs."
    metricLabel="burst"
    chipsLabel="Recommended cooldowns"
    rangeLabel="Damage vs top range"
    (openMap)="onOpenMap($event)"
    (openClip)="onOpenClip($event)">
  </wl-window-comparison>
}
