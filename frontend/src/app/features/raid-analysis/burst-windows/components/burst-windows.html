@if (error() || !available()) {
  <wl-load-state heading="Burst Windows" subtitle="Damage in each burst window vs top parses." [error]="error()"></wl-load-state>
} @else {
  <wl-window-comparison
    [windows]="windows()"
    [higherIsBetter]="true"
    [showMap]="showMap()"
    [showClip]="showClip()"
    heading="Burst Windows"
    subtitle="Damage in each burst window vs top parses."
    metricLabel="damage"
    chipsLabel="Cooldowns top raiders use here"
    rangeLabel="Damage vs top range"
    windowHint="A stretch of the fight where top raiders have their cooldowns up"
    (openMap)="onOpenMap($event)"
    (openClip)="onOpenClip($event)">
  </wl-window-comparison>
}
