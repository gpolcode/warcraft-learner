type Zone {
  id: Int!
  brackets: Bracket
  difficulties: [Difficulty]
  encounters: [Encounter]
  expansion: Expansion!
  frozen: Boolean!
  name: String!
  partitions: [Partition]
}

type ReportComponentData {
  list: [ReportComponent!]!
  get(key: String!): ReportComponent
  evaluateScript(contents: String!, filter: ReportComponentFilter, debug: Boolean, reportCode: String!): ReportComponentResult
}

type ReportComponentMutation {
  create(name: String!, contents: String): String
  upsert(key: String, name: String!, contents: String!, protected: Boolean!): String!
  updateContents(key: String!, contents: String!): Boolean
  setDeletionProtected(key: String!, protected: Boolean = true): Boolean
  delete(key: String!): Boolean
}

type ReportComponent {
  key: String!
  name: String!
  deletionProtected: Boolean!
  contents: String
  evaluate(filter: ReportComponentFilter, debug: Boolean, reportCode: String!): ReportComponentResult
}

input ReportComponentFilter {
  fightIDs: [Int!]
  actorID: Int
  timestampRange: ReportComponentRangeFilter
  encounterID: Int
  phase: Int
  deathCutoff: Int
  killType: KillType = All
  difficulty: Int
}

input ReportComponentRangeFilter {
  startTime: Int!
  endTime: Int!
}

type ReportComponentResult {
  output: JSON
  logs: String
  error: String
}

type Query {
  characterData: CharacterData
  gameData: GameData
  guildData: GuildData
  progressRaceData: ProgressRaceData
  rateLimitData: RateLimitData
  reportData: ReportData
  userData: UserData
  worldData: WorldData
  reportComponentData: ReportComponentData
  systemReportComponentData: ReportComponentData
}

"""
The `Report.playerDetails` payload. scripts/codegen.mjs maps this scalar to the app model that reads it.
"""
scalar PlayerDetailsJson

"""
The `Report.table` payload. scripts/codegen.mjs maps this scalar to the app model that reads it.
"""
scalar TableJson

"""
The `Encounter.characterRankings` payload. scripts/codegen.mjs maps this scalar to the app model that reads it.
"""
scalar RankingsJson

"""
The `ReportEventPaginator.data` payload. scripts/codegen.mjs maps this scalar to the app model that reads it.
"""
scalar EventDataJson
